    <script>
      // Prevent "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var origFetch = window.fetch.bind(window);
            var activeFetch = origFetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return activeFetch; },
                set: function(fn) { activeFetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              // ignore descriptor failure if unconfigurable
            }
          }
        } catch (err) {
          // ignore
        }
      })();
    </script>
